name: "Oppdater url til mikrofrontendmanifest"
on:
  workflow_call:
    inputs:
      cluster:
        required: true
        type: string
      id:
        required: true
        type: string
      url:
        required: true
        type: string
      commitmsg:
        required: false
        type: string
    # Deklarert slik at callere kan sende secretsene eksplisitt i stedet for `secrets: inherit`.
    # Uten deklarasjonen avviser GitHub kjøringen til en slik caller før noen jobb starter:
    # "Secret PRIVATE_KEY is not defined in the referenced workflow" (startup_failure).
    # `required: false` er bevisst: dagens callere bruker `inherit`, og de skal fortsette å virke uendret.
    secrets:
      PRIVATE_KEY:
        required: false
        description: "Privat nøkkel til GitHub-appen som oppdaterer manifestet. Må være tilgjengelig – enten sendt eksplisitt eller arvet."
      APP_ID:
        required: false
        description: "App-ID til den samme GitHub-appen."
jobs:
  trigger_manifest_update:
    runs-on: ubuntu-latest
    steps:
      - uses: navikt/github-app-token-generator@v1
        id: get-token
        with:
          private-key: ${{ secrets.PRIVATE_KEY }}
          app-id: ${{ secrets.APP_ID }}
      - run: |
          curl --request POST \
          --url 'https://api.github.com/repos/navikt/tms-mikrofrontend-selector/dispatches' \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ steps.get-token.outputs.token }}" \
          --data '{"event_type": "update_microfrontend_manifest",
               "client_payload": {
                     "id": "${{ inputs.id }}",
                     "url":"${{ inputs.url}}", 
                     "cluster":"${{ inputs.cluster }}",
                     "initiator": "${{ github.actor }}",
                     "commitmsg": "${{ inputs.commitmsg }}"
                  }}'