name: "Build and deploy mikrofrontend"
on:
  workflow_call:
    inputs:
      cluster:
        required: true
        type: string
      node-version:
        required: true
        type: string
    # Deklarert slik at callere kan sende secretsene eksplisitt i stedet for `secrets: inherit`.
    # Uten deklarasjonen avviser GitHub kjøringen til en slik caller før noen jobb starter:
    # "Secret ... is not defined in the referenced workflow" (startup_failure).
    # `required: false` er bevisst: dagens callere bruker `inherit`, og de skal fortsette å virke uendret.
    secrets:
      READER_TOKEN:
        required: false
        description: "Token for å lese @navikt-pakker fra npm.pkg.github.com under `npm ci`."
      NAIS_WORKLOAD_IDENTITY_PROVIDER:
        required: false
        description: "Identity provider for CDN-opplasting og image-bygg mot Nais."
      NAIS_DEPLOY_APIKEY:
        required: false
        description: "API-nøkkel for nais/deploy@v1 i deploy-jobben."
env:
  "IMAGE": "ghcr.io/${{ github.repository }}/mikrofrontend:${{ github.sha }}"
jobs:
  build:
    name: "build"
    runs-on: "ubuntu-latest"

    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'write'

    steps:
      - name: Set repository name
        run: echo "REPOSITORY_NAME=$(echo $GITHUB_REPOSITORY | rev | cut -f1 -d"/" | rev )" >> $GITHUB_ENV
      - uses: "actions/checkout@v3"
      - uses: "actions/setup-node@v3"
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://npm.pkg.github.com"
          cache: 'npm'
      - name: "Install dependencies"
        run: "npm ci"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Run tests
        run: npm test
      - name: "Build application"
        run: "npm run build"
      - name: cdn-upload
        uses: nais/deploy/actions/cdn-upload/v2@master
        with:
          team: min-side
          source: ./dist
          destination: ${{ env.REPOSITORY_NAME }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
      - name: "Build and push"
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: min-side
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        cluster: ${{ fromJSON(inputs.cluster) }}

    steps:
      - uses: "actions/checkout@v3"
      - name: "Deploy to ${{ matrix.cluster }}"
        uses: "nais/deploy/actions/deploy@v1"
        env:
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: ${{ matrix.cluster }}
          RESOURCE: nais/${{ matrix.cluster }}/nais.yaml
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}