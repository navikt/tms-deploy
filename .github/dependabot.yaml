version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/oppdater-mikrofrontend-manifest*.yaml"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "nais/deploy/actions/deploy"
    groups:
      github-actions:
        patterns:
          - "*"
